<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE VIEW - 바리스타 대시보드</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 20px; background-color: #121212; color: #fff; user-select: none; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1 { margin: 0; color: #f8f9fa; font-size: 24px; }
        .sub-guide { text-align: center; color: #888; font-size: 13px; margin-bottom: 20px; }
        
        .btn-history { background: #333; color: #fff; border: 1px solid #555; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-history:hover { background: #444; }

        /* 카드 가로 폭을 넓게 조정하여 텍스트가 가로로 길게 배치되도록 설정 */
        .order-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 15px; }
        
        .order-card { 
            background: #1e1e1e; 
            border: 2px solid #333; 
            border-radius: 12px; 
            padding: 16px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.4); 
            cursor: pointer; 
            transition: background 0.15s ease, border-color 0.15s ease; 
        }
        
        .order-card.status-making { background: #0f381e !important; border-color: #2ed573 !important; }
        .order-card.status-making .status-badge { background-color: #2ed573; color: #000; }

        .order-card.status-served { background: #0d2a4a !important; border-color: #1e90ff !important; opacity: 0.85; }
        .order-card.status-served .status-badge { background-color: #1e90ff; color: #fff; }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .table-badge { background: #ff4757; color: white; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 15px; }
        .status-badge { background: #444; color: #ccc; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }

        .menu-list-box { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        
        /* 메뉴 아이템 한 줄 가로 출력 및 줄바꿈 방지 */
        .menu-item-row { 
            font-size: 15px; 
            font-weight: bold; 
            color: #ffa502; 
            background: rgba(255,255,255,0.05); 
            padding: 10px 12px; 
            border-radius: 6px; 
            white-space: nowrap; 
            overflow-x: auto; 
        }

        /* 품목명 바로 아래에 위치하는 개별 요청사항 박스 */
        .item-memo-box { 
            background: rgba(255, 193, 7, 0.2); 
            border-left: 3px solid #ffc107; 
            color: #ffecb3; 
            padding: 6px 10px; 
            border-radius: 4px; 
            font-size: 12px; 
            margin-top: 4px; 
            font-weight: normal;
        }

        .time-text { font-size: 12px; color: #aaa; text-align: right; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; }
        .no-order { text-align: center; color: #666; grid-column: 1 / -1; margin-top: 50px; font-size: 18px; }

        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .modal-content { background-color: #1e1e1e; margin: 5% auto; padding: 20px; border: 1px solid #444; width: 85%; max-width: 700px; border-radius: 12px; max-height: 80vh; overflow-y: auto; color: #fff; }
        .close-modal { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close-modal:hover { color: #fff; }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        .history-table th, .history-table td { border: 1px solid #333; padding: 8px; text-align: left; }
        .history-table th { background: #2a2a2a; }
        
        .btn-restore { background: #e67e22; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-restore:hover { background: #d35400; }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>THE VIEW 실시간 주문 대시보드</h1>
        <button class="btn-history" onclick="openHistoryModal()">주문 히스토리 보기</button>
    </div>
    <div class="sub-guide">카드를 더블클릭(2번 터치)하면 [제조완료(초록)] ➔ [제공완료(파랑, 30초 후 숨김)]로 즉시 전환됩니다.</div>

    <div id="order-list" class="order-container">
        <div class="no-order">주문 데이터를 불러오는 중...</div>
    </div>

    <!-- 히스토리 모달 창 -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeHistoryModal()">&times;</span>
            <h2>전체 주문 히스토리 및 복구</h2>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>접수시간</th>
                        <th>테이블</th>
                        <th>주문 내역</th>
                        <th>상태</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="history-table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzFII67V5lEWlEOMH9x9Ao8PnQUhk4Z9KZJ2x0PB-5GPa8XHKhTqDa8htVK2X-rhbrKVw/exec";

        let previousOrderCount = null;
        let cachedOrders = [];

        // 영문 메뉴명/옵션을 한국어로 완벽하게 변환하는 매핑 사전 (실무 직관성 확보)
        function translateToKorean(rawText) {
            if (!rawText) return "";
            let text = rawText;

            // 메뉴명 매핑
            const menuMap = {
                "Espresso": "에스프레소",
                "Double Espresso (Doppio)": "더블 에스프레소 (도피오)",
                "Americano": "아메리카노",
                "Cafe Latte": "카페라떼",
                "Vanilla Latte": "바닐라라떼",
                "Cappuccino": "카푸치노",
                "Chamomile": "카모마일",
                "Peppermint": "페퍼민트",
                "Rooibos": "루이보스",
                "Red Berry": "레드베리",
                "Green Tea": "녹차",
                "Earl Grey": "얼그레이",
                "English Breakfast": "잉글리쉬 블랙퍼스트",
                "Milk Chocolate": "밀크 초콜릿"
            };

            for (let [eng, kor] of Object.entries(menuMap)) {
                text = text.replace(new RegExp(eng, 'g'), kor);
            }

            // 옵션 매핑
            text = text.replace(/Decaf/g, "디카페인")
                       .replace(/Regular/g, "일반")
                       .replace(/Cinnamon Yes/g, "시나몬 O")
                       .replace(/Cinnamon No/g, "시나몬 X")
                       .replace(/cup\(s\)/g, "잔")
                       .replace(/Requests:/g, "요청사항:");

            return text;
        }

        function getServedTimes() {
            try { return JSON.parse(localStorage.getItem('the_view_served_times') || '{}'); } catch (e) { return {}; }
        }
        function saveServedTimes(times) {
            try { localStorage.setItem('the_view_served_times', JSON.stringify(times)); } catch (e) {}
        }

        function playNotificationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } catch (e) {}
        }

        function formatDateTime(timestampStr) {
            if (!timestampStr) return "";
            try {
                const date = new Date(timestampStr);
                if (!isNaN(date.getTime())) {
                    const yyyy = date.getFullYear();
                    const mm = String(date.getMonth() + 1).padStart(2, '0');
                    const dd = String(date.getDate()).padStart(2, '0');
                    const hh = String(date.getHours()).padStart(2, '0');
                    const min = String(date.getMinutes()).padStart(2, '0');
                    const ss = String(date.getSeconds()).padStart(2, '0');
                    return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
                }
            } catch (e) {}
            return timestampStr;
        }

        function formatTime(timestampStr) {
            if (!timestampStr) return "";
            try {
                const date = new Date(timestampStr);
                if (!isNaN(date.getTime())) {
                    return date.toTimeString().substring(0, 8);
                }
            } catch (e) {}
            return timestampStr.length >= 19 ? timestampStr.substring(11, 19) : timestampStr;
        }

        function fetchOrders() {
            fetch(GAS_URL)
                .then(response => response.json())
                .then(data => {
                    cachedOrders = data;
                    const servedTimes = getServedTimes();
                    const now = Date.now();
                    
                    const activeOrders = data.filter(order => {
                        if (order.status === "제공완료") {
                            if (!servedTimes[order.row]) {
                                servedTimes[order.row] = now;
                                saveServedTimes(servedTimes);
                            }
                            if (now - servedTimes[order.row] > 30000) return false;
                        }
                        return true;
                    });

                    const currentPendingCount = activeOrders.filter(o => o.status === "접수대기").length;
                    if (previousOrderCount !== null && currentPendingCount > previousOrderCount) {
                        playNotificationSound();
                    }
                    previousOrderCount = currentPendingCount;

                    renderDashboard(activeOrders);
                })
                .catch(err => console.error('데이터 로드 실패:', err));
        }

        function renderDashboard(orders) {
            const orderListEl = document.getElementById('order-list');
            orderListEl.innerHTML = '';

            if (orders.length === 0) {
                orderListEl.innerHTML = '<div class="no-order">현재 대기 중인 주문이 없습니다.</div>';
                return;
            }

            orders.reverse().forEach(order => {
                const card = document.createElement('div');
                let statusClass = '';
                let statusLabel = '접수대기';

                if (order.status === '제조완료') {
                    statusClass = 'status-making';
                    statusLabel = '제조완료';
                } else if (order.status === '제공완료') {
                    statusClass = 'status-served';
                    statusLabel = '제공완료 (30초 후 숨김)';
                }

                card.className = `order-card ${statusClass}`;
                card.id = `card-${order.row}`;
                card.setAttribute('ondblclick', `handleCardDblClick(${order.row}, '${order.status}')`);

                // 전체 메뉴 텍스트를 한국어로 강제 변환
                const translatedMenu = translateToKorean(order.menu || "");

                // 품목별 줄바꿈 및 개별 요청사항(메모) 분리 파싱
                let menuHtml = '';
                let globalMemo = "";

                if (translatedMenu.includes("요청사항:")) {
                    const parts = translatedMenu.split("요청사항:");
                    const itemsPart = parts[0].trim();
                    globalMemo = parts[1].replace(/\[\vert{}\]/g, "").trim();

                    itemsPart.split(',').forEach(item => {
                        const cleanItem = item.trim();
                        if (cleanItem) {
                            menuHtml += `<div class="menu-item-row">${cleanItem}</div>`;
                        }
                    });

                    if (globalMemo) {
                        menuHtml += `<div class="item-memo-box"><b>요청사항:</b> ${globalMemo}</div>`;
                    }
                } else {
                    translatedMenu.split(',').forEach(item => {
                        const cleanItem = item.trim();
                        if (cleanItem) {
                            menuHtml += `<div class="menu-item-row">${cleanItem}</div>`;
                        }
                    });
                }

                const cleanTime = formatTime(order.timestamp);

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="table-badge">테이블: ${order.tableNo}</span>
                            <span class="status-badge">${statusLabel}</span>
                        </div>
                        <div class="menu-list-box">${menuHtml}</div>
                    </div>
                    <div class="time-text">${cleanTime} 접수</div>
                `;
                orderListEl.appendChild(card);
            });
        }

        function handleCardDblClick(rowIdx, currentStatus) {
            let nextStatus = currentStatus === '제조완료' ? '제공완료' : '제조완료';
            if (currentStatus === '제공완료') return;

            const cardEl = document.getElementById(`card-${rowIdx}`);
            if (cardEl) {
                cardEl.className = `order-card ${nextStatus === '제조완료' ? 'status-making' : 'status-served'}`;
                cardEl.querySelector('.status-badge').innerText = nextStatus === '제조완료' ? '제조완료' : '제공완료 (30초 후 숨김)';
                cardEl.setAttribute('ondblclick', `handleCardDblClick(${rowIdx}, '${nextStatus}')`);
            }

            const target = cachedOrders.find(o => o.row === rowIdx);
            if (target) target.status = nextStatus;

            if (nextStatus === '제공완료') {
                const servedTimes = getServedTimes();
                servedTimes[rowIdx] = Date.now();
                saveServedTimes(servedTimes);
            }

            fetch(`${GAS_URL}?action=updateStatus&row=${rowIdx}&status=${encodeURIComponent(nextStatus)}`)
                .then(response => response.json())
                .catch(err => console.error('상태 전송 실패:', err));
        }

        function restoreOrder(rowIdx) {
            if (confirm("해당 주문을 다시 '접수대기' 상태로 복구하시겠습니까?")) {
                const servedTimes = getServedTimes();
                delete servedTimes[rowIdx];
                saveServedTimes(servedTimes);

                const target = cachedOrders.find(o => o.row === rowIdx);
                if (target) target.status = '접수대기';

                fetchOrders();
                closeHistoryModal();

                fetch(`${GAS_URL}?action=updateStatus&row=${rowIdx}&status=접수대기`)
                    .then(response => response.json())
                    .catch(err => console.error('복구 전송 실패:', err));
            }
        }

        function openHistoryModal() {
            const tbody = document.getElementById('history-table-body');
            tbody.innerHTML = '';

            [...cachedOrders].reverse().forEach(order => {
                const cleanDateTime = formatDateTime(order.timestamp);
                const translatedMenu = translateToKorean(order.menu || "");
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${cleanDateTime}</td>
                    <td><b>${order.tableNo}</b></td>
                    <td>${translatedMenu}</td>
                    <td><span style="color: ${order.status === '제공완료' ? '#1e90ff' : (order.status === '제조완료' ? '#2ed573' : '#ffa502')}">${order.status}</span></td>
                    <td><button class="btn-restore" onclick="restoreOrder(${order.row})">복구</button></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('historyModal').style.display = 'block';
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById('historyModal')) {
                closeHistoryModal();
            }
        }

        fetchOrders();
        setInterval(fetchOrders, 3000);
    </script>

</body>
</html>
