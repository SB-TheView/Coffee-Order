<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE VIEW Coffee-Order</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 480px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; }
        
        /* 언어 선택 스위치 (우측 상단) */
        .lang-switch { position: absolute; top: 15px; right: 15px; display: flex; gap: 4px; background: #eee; padding: 3px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .lang-btn { border: none; background: transparent; padding: 4px 8px; border-radius: 4px; cursor: pointer; color: #666; font-size: 12px; font-weight: bold; }
        .lang-btn.active { background: #007bff; color: white; }

        /* 헤더 및 타이틀 스타일 */
        .header { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 20px; margin-top: 10px; }
        .brand-title { margin: 0; padding: 0; }
        .brand-main { font-size: 26px; font-weight: 800; color: #1a1a1a; letter-spacing: 4px; line-height: 1.2; text-transform: uppercase; }
        .brand-sub { font-size: 18px; font-weight: 600; color: #555; letter-spacing: 3px; margin-top: 6px; }
        
        .table-badge { display: inline-block; background: #007bff; color: white; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-top: 14px; }
        
        /* 메뉴 카드 스타일 */
        .menu-card { display: flex; justify-content: space-between; align-items: center; padding: 15px 10px; border-bottom: 1px solid #eee; }
        .menu-name { font-size: 16px; font-weight: bold; color: #333; flex: 1; }
        
        /* 수량 조절 및 주문 버튼 영역 */
        .order-controls { display: flex; align-items: center; gap: 8px; }
        .btn-qty { background: #e9ecef; border: 1px solid #ced4da; width: 32px; height: 32px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-qty:active { background: #dee2e6; }
        .qty-val { font-size: 16px; font-weight: bold; width: 24px; text-align: center; }
        .btn-order { background-color: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-order:hover { background-color: #218838; }
        
        .loading { display: none; text-align: center; color: #007bff; margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 우측 상단 언어 선택 버튼 -->
        <div class="lang-switch">
            <button id="btn-kor" class="lang-btn active" onclick="setLanguage('kor')">KOR</button>
            <button id="btn-eng" class="lang-btn" onclick="setLanguage('eng')">ENG</button>
        </div>

        <div class="header">
            <div class="brand-title">
                <div class="brand-main">THE VIEW</div>
                <div class="brand-sub">☕Coffee-Order☕</div>
            </div>
            <div id="table-display" class="table-badge">테이블 확인 중...</div>
        </div>

        <div id="menu-list">
            <!-- 메뉴 1: 아메리카노 (HOT) -->
            <div class="menu-card">
                <span class="menu-name" data-menu-kor="아메리카노 (HOT)" data-menu-eng="Americano (HOT)">아메리카노 (HOT)</span>
                <div class="order-controls">
                    <button class="btn-qty" onclick="changeQty('qty-1', -1)">-</button>
                    <span id="qty-1" class="qty-val">1</span>
                    <button class="btn-qty" onclick="changeQty('qty-1', 1)">+</button>
                    <button class="btn-order" onclick="submitOrder(this, 'qty-1')">주문하기</button>
                </div>
            </div>

            <!-- 메뉴 2: 카페라떼 (ICE) -->
            <div class="menu-card">
                <span class="menu-name" data-menu-kor="카페라떼 (ICE)" data-menu-eng="Cafe Latte (ICE)">카페라떼 (ICE)</span>
                <div class="order-controls">
                    <button class="btn-qty" onclick="changeQty('qty-2', -1)">-</button>
                    <span id="qty-2" class="qty-val">1</span>
                    <button class="btn-qty" onclick="changeQty('qty-2', 1)">+</button>
                    <button class="btn-order" onclick="submitOrder(this, 'qty-2')">주문하기</button>
                </div>
            </div>
        </div>

        <div id="loading-text" class="loading">주문을 전송 중입니다... 잠시만 기다려주세요.</div>
    </div>

    <script>
        // ⚠️ 구글 앱스 스크립트 웹 앱 URL을 입력하세요!
        const GAS_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

        // 현재 언어 상태 (기본값: kor)
        let currentLang = 'kor';

        // 언어별 다국어 텍스트 정의
        const i18n = {
            kor: {
                tablePrefix: "테이블 번호: ",
                tableNone: "미지정",
                orderBtn: "주문하기",
                loading: "주문을 전송 중입니다... 잠시만 기다려주세요.",
                noTableAlert: "테이블 정보가 없습니다. QR 코드를 다시 스캔해 주세요.",
                confirmOrder: (table, menu, qty) => `[${table}]번 테이블\n'${menu} (${qty}잔)' 주문을 전송하시겠습니까?`,
                successAlert: "주문이 성공적으로 접수되었습니다!",
                errorAlert: "주문 전송 중 오류가 발생했습니다."
            },
            eng: {
                tablePrefix: "Table No: ",
                tableNone: "Unassigned",
                orderBtn: "Order",
                loading: "Sending your order... Please wait.",
                noTableAlert: "No table information found. Please scan the QR code again.",
                confirmOrder: (table, menu, qty) => `[Table ${table}]\nSend order for '${menu} (${qty} cup(s))'?`,
                successAlert: "Your order has been successfully placed!",
                errorAlert: "An error occurred while sending your order."
            }
        };

        // 1. URL 파라미터에서 테이블 번호 추출
        const urlParams = new URLSearchParams(window.location.search);
        const tableNo = urlParams.get('table') || '미지정';

        // 2. 언어 변경 처리 함수
        function setLanguage(lang) {
            currentLang = lang;
            
            // 스위치 버튼 활성화 스타일
            document.getElementById('btn-kor').classList.toggle('active', lang === 'kor');
            document.getElementById('btn-eng').classList.toggle('active', lang === 'eng');

            // 테이블 표시 텍스트 변경
            const displayTable = tableNo === '미지정' ? i18n[lang].tableNone : tableNo;
            document.getElementById('table-display').innerText = `${i18n[lang].tablePrefix}${displayTable}`;

            // 메뉴 이름 변경
            document.querySelectorAll('.menu-name').forEach(el => {
                el.innerText = lang === 'kor' ? el.getAttribute('data-menu-kor') : el.getAttribute('data-menu-eng');
            });

            // 주문 버튼 텍스트 변경
            document.querySelectorAll('.btn-order').forEach(el => {
                el.innerText = i18n[lang].orderBtn;
            });

            // 로딩 텍스트 변경
            document.getElementById('loading-text').innerText = i18n[lang].loading;
        }

        // 초기 화면 표시 (기본 언어 설정 적용)
        setLanguage('kor');

        // 3. 수량 변경 함수
        function changeQty(elementId, change) {
            const qtyEl = document.getElementById(elementId);
            let currentQty = parseInt(qtyEl.innerText);
            currentQty += change;
            if (currentQty < 1) currentQty = 1;
            if (currentQty > 10) currentQty = 10;
            qtyEl.innerText = currentQty;
        }

        // 4. 주문 전송 함수
        function submitOrder(btnEl, qtyElementId) {
            if (tableNo === '미지정') {
                alert(i18n[currentLang].noTableAlert);
                return;
            }

            const menuCard = btnEl.closest('.menu-card');
            const menuNameEl = menuCard.querySelector('.menu-name');
            const menuName = currentLang === 'kor' ? menuNameEl.getAttribute('data-menu-kor') : menuNameEl.getAttribute('data-menu-eng');
            const quantity = document.getElementById(qtyElementId).innerText;

            if (confirm(i18n[currentLang].confirmOrder(tableNo, menuName, quantity))) {
                const loadingText = document.getElementById('loading-text');
                loadingText.style.display = 'block';

                // 구글 시트에는 바리스타 전달용으로 표준 표기(메뉴명 + 수량) 전송
                const fullMenuName = `${menuName} (${quantity}잔)`;

                fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        tableNo: tableNo,
                        menu: fullMenuName
                    })
                })
                .then(() => {
                    loadingText.style.display = 'none';
                    alert(i18n[currentLang].successAlert);
                    document.getElementById(qtyElementId).innerText = "1";
                })
                .catch(error => {
                    loadingText.style.display = 'none';
                    console.error('Error:', error);
                    alert(i18n[currentLang].errorAlert);
                });
            }
        }
    </script>

</body>
</html>
